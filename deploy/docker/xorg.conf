Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "KiteDummy"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "KiteMonitor"
    HorizSync 5.0 - 1000.0
    VertRefresh 5.0 - 200.0
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +HSync +VSync
    Modeline "1280x720" 74.50 1280 1344 1472 1664 720 723 728 748 -HSync +VSync
    Modeline "2560x1440" 241.50 2560 2608 2640 2720 1440 1443 1448 1481 +HSync -VSync
EndSection

Section "Screen"
    Identifier "KiteScreen"
    Device "KiteDummy"
    Monitor "KiteMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080" "1280x720" "2560x1440"
        Virtual 3840 2160
    EndSubSection
EndSection

Section "InputClass"
    Identifier "Ignore physical server input"
    MatchDevicePath "/dev/input/event*"
    Option "Ignore" "true"
EndSection

Section "InputClass"
    Identifier "Sunshine virtual input"
    MatchProduct "Sunshine|libvirtualhid"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Ignore" "false"
EndSection
