name: Android presentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-presentation.yml'
      - 'android/app/src/main/java/io/github/wenshiqi0/kite/ui/Item*.kt'
      - 'android/app/src/main/java/io/github/wenshiqi0/kite/ui/Markdown*.kt'
      - 'android/app/src/main/java/io/github/wenshiqi0/kite/ui/Attachment*.kt'
      - 'android/app/src/androidTest/java/io/github/wenshiqi0/kite/NativePresentationTest.kt'
      - 'android/app/src/androidTest/java/io/github/wenshiqi0/kite/WorkspaceRefinementPresentationTest.kt'

permissions:
  contents: read

concurrency:
  group: android-presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      ANDROID_ADB_SERVER_PORT: 5038
      ADB_SERVER_SOCKET: tcp:127.0.0.1:5038
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android and Rust build tools
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370' 'emulator' 'system-images;android-36;default;x86_64'
          rustup toolchain install stable --profile minimal --target x86_64-linux-android
          rustup default stable
          curl -fsSL https://bun.sh/install | bash -s 'bun-v1.3.14'
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: android-presentation-${{ runner.os }}-ndk30-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            android-presentation-${{ runner.os }}-ndk30-${{ hashFiles('Cargo.lock') }}-
            android-rust-${{ runner.os }}-ndk30-${{ hashFiles('Cargo.lock') }}-
      - name: Build the app and native presentation tests
        run: |
          bun install --frozen-lockfile
          if ! command -v cargo-ndk >/dev/null; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          ./android/gradlew -p android -Pkite.rustAbis=x86_64 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Verify native text layout and document preview taps
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/presentation" "$RUNNER_TEMP/kite-avd"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/kite-avd"
          sudo chmod a+rw /dev/kvm
          printf 'no\n' | avdmanager create avd --name kite-presentation --package 'system-images;android-36;default;x86_64' --device pixel_6
          adb -P 5038 start-server
          "$ANDROID_HOME/emulator/emulator" -avd kite-presentation -port 5584 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -cores 2 -memory 2048 -no-metrics -http-proxy http://127.0.0.1:9 > "$RUNNER_TEMP/presentation/emulator.log" 2>&1 &
          trap 'adb -P 5038 -s emulator-5584 emu kill >/dev/null 2>&1 || true' EXIT
          timeout 180 adb -P 5038 -s emulator-5584 wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb -P 5038 -s emulator-5584 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb -P 5038 -s emulator-5584 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -P 5038 -s emulator-5584 shell cmd connectivity airplane-mode enable
          adb -P 5038 -s emulator-5584 shell settings put global window_animation_scale 0
          adb -P 5038 -s emulator-5584 shell settings put global transition_animation_scale 0
          adb -P 5038 -s emulator-5584 shell input keyevent KEYCODE_WAKEUP
          adb -P 5038 -s emulator-5584 shell wm dismiss-keyguard
          adb -P 5038 -s emulator-5584 install -r -t android/app/build/outputs/apk/debug/app-debug.apk
          adb -P 5038 -s emulator-5584 install -r -t android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb -P 5038 -s emulator-5584 shell am instrument -w -r -e class 'io.github.wenshiqi0.kite.NativePresentationTest,io.github.wenshiqi0.kite.WorkspaceRefinementPresentationTest#documentReferencesStayInsideProseAndOpenTheOriginalText,io.github.wenshiqi0.kite.WorkspaceRefinementPresentationTest#mixedItemBlocksRenderInOrderWithoutHidingTextOrTools,io.github.wenshiqi0.kite.WorkspaceRefinementPresentationTest#toolMediaUsesFullWidthAndImagesFormCompactAlbums' io.github.wenshiqi0.kite.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/presentation/results.txt"
          adb -P 5038 -s emulator-5584 pull /sdcard/Android/data/io.github.wenshiqi0.kite/files/. "$RUNNER_TEMP/presentation/"
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path(os.environ['RUNNER_TEMP'], 'presentation/results.txt').read_text()
          assert re.search(r'^OK \([1-9]\d* tests?\)', text, re.M) and 'FAILURES!!!' not in text, text
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-presentation
          path: ${{ runner.temp }}/presentation
          retention-days: 7
