name: Android Release
run-name: Android Release · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['v*-alpha.*']
    paths:
      - 'android/**'
      - 'crates/**'
      - 'backend/**'
      - 'desktop/**'
      - 'Cargo.*'
      - '.gitmodules'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Alpha version and source
        id: version
        run: |
          python3 android/scripts/release-alpha.py --check-only > "$RUNNER_TEMP/version.json"
          python3 - <<'PY'
          import json, os
          value = json.load(open(os.environ['RUNNER_TEMP'] + '/version.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + value['version'] + '\n')
          PY

      - name: Check Alpha publisher
        run: python3 -m unittest discover -s android/scripts -p 'test_*.py'

      - name: Check host adapter
        run: python3 -m unittest discover -s backend -p 'test_*.py'

      - name: Check Linux host package
        run: python3 -m unittest discover -s desktop/linux -p 'test_*.py'

      - name: Check Linux native status lifecycle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 xvfb dbus-x11
          xvfb-run -a dbus-run-session -- /usr/bin/python3 desktop/linux/qa/tray_probe.py

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370'

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target aarch64-linux-android
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: android-rust-${{ runner.os }}-ndk30-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            android-rust-${{ runner.os }}-ndk30-${{ hashFiles('Cargo.lock') }}-
            android-rust-${{ runner.os }}-ndk30-

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi

      - name: Check Rust core
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Restore Alpha signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_ALPHA_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          value = os.environ['KEYSTORE_BASE64']
          if not value:
              raise SystemExit('Configure the ANDROID_ALPHA_KEYSTORE_BASE64 repository secret.')
          path = os.environ['RUNNER_TEMP'] + '/kite-alpha.keystore'
          with open(path, 'wb') as f:
              f.write(base64.b64decode(value, validate=True))
          os.chmod(path, 0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('KITE_ALPHA_KEYSTORE=' + path + '\n')
          PY

      - name: Build and verify signed Release APK
        if: github.event_name != 'pull_request'
        env:
          KITE_ALPHA_STORE_PASSWORD: ${{ secrets.ANDROID_ALPHA_STORE_PASSWORD || 'android' }}
          KITE_ALPHA_KEY_PASSWORD: ${{ secrets.ANDROID_ALPHA_KEY_PASSWORD || 'android' }}
          KITE_ALPHA_KEY_ALIAS: ${{ secrets.ANDROID_ALPHA_KEY_ALIAS || 'androiddebugkey' }}
          KITE_EXPECTED_CERTIFICATE_SHA256: ${{ vars.ANDROID_ALPHA_CERT_SHA256 }}
        run: |
          test -n "$KITE_EXPECTED_CERTIFICATE_SHA256"
          python3 android/scripts/release-alpha.py --build-only

      - name: Build unsigned Release for pull requests
        if: github.event_name == 'pull_request'
        run: ./android/gradlew -p android :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest --no-daemon --console=plain

      - name: Upload verified Alpha build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kite-release-${{ github.sha }}
          path: android/release-output/v${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kite-unsigned-pr-${{ github.event.number }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kite-alpha.keystore"

  publish:
    name: Publish Alpha Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kite-release-${{ github.sha }}
          path: android/release-output/v${{ needs.build.outputs.version }}

      - name: Read annotated release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish and verify GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 android/scripts/release-alpha.py --publish-only --notes-file "$RUNNER_TEMP/release-notes.md"
