name: Kite

options:
  bundleIdPrefix: io.github.wenshiqi0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The Rust build script writes outside the declared outputs (cargo's target/).
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Kite:
    type: application
    platform: iOS
    sources:
      - path: Kite
      # Written by scripts/build-rust.sh before the Swift sources compile.
      - path: Generated/kite_ffi.swift
        optional: true
    preBuildScripts:
      - name: Build Rust core
        script: |
          "${SRCROOT}/scripts/build-rust.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/kite_ffi.swift
          - $(SRCROOT)/build/rust/$(PLATFORM_NAME)/libkite_ffi.a
    dependencies:
      - sdk: Security.framework
    info:
      path: Kite/Info.plist
      properties:
        CFBundleDisplayName: kite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: kite 需要访问局域网里的主机，通过 SSH 连接 herdr。
    settings:
      base:
        PRODUCT_NAME: Kite
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wenshiqi0.kite
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/rust/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lkite_ffi
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/include
